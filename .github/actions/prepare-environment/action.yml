name: prepare-environment
description: Installs the system packages shared by the build, test, and package jobs
runs:
  using: "composite"
  steps:
    - name: Install system packages
      run: |
        mkdir -p ${{github.workspace}}/build
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
           tar \
           wget \
           cmake \
           buildah \
           ninja-build \
           clang \
           pkg-config \
           build-essential
      shell: bash
